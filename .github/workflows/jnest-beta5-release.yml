name: JNest beta5 Windows build and prerelease

on:
  push:
    branches:
      - beta/v0.3.34-workspace-shell-radius
    paths:
      - 'MainWindow.xaml'
      - 'JuChuang.csproj'
      - 'RELEASE_NOTES.md'
      - '.github/workflows/jnest-beta5-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish framework-dependent x64
        shell: pwsh
        run: dotnet publish JuChuang.csproj -c Release -r win-x64 --self-contained false -p:Platform=x64 -o out/framework
      - name: Publish self-contained x64
        shell: pwsh
        run: dotnet publish JuChuang.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -o out/selfcontained
      - name: Zip Windows outputs
        shell: pwsh
        run: |
          Compress-Archive -Path out/framework/* -DestinationPath JNest-v0.3.34-beta5-FrameworkDependent-win-x64.zip
          Compress-Archive -Path out/selfcontained/* -DestinationPath JNest-v0.3.34-beta5-SelfContained-win-x64.zip
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JNest-v0.3.34-beta5-win-x64
          path: JNest-v0.3.34-beta5-*.zip
      - name: Publish beta prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = 'v0.3.34-beta5'
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release tag $tag already exists; refusing to overwrite it."
          }
          gh release create $tag JNest-v0.3.34-beta5-*.zip --target "${{ github.sha }}" --title "JNest v0.3.34-beta5" --prerelease --notes "Workspace shell corner-radius experiment based on beta2 native-client hosting. Windows 11 verification required. Unsigned build."
