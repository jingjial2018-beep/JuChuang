name: JNest PR test package (no release)

on:
  push:
    branches:
      - maintenance/**
      - fix/**
  pull_request:
    branches:
      - stable
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/**'

permissions:
  contents: read

concurrency:
  group: pr-test-package-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Read preview version
        shell: pwsh
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          [xml]$project = Get-Content .\JuChuang.csproj
          $baseVersion = $project.Project.PropertyGroup.Version
          $previewSuffix = if ([string]::IsNullOrWhiteSpace($env:PR_NUMBER)) { "build$($env:RUN_NUMBER)" } else { "pr$($env:PR_NUMBER)" }
          "PREVIEW_VERSION=$baseVersion-preview.$previewSuffix" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PACKAGE_NAME=JNest-v$baseVersion-preview-$previewSuffix" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Restore
        run: dotnet restore .\JuChuang.csproj -r win-x64

      - name: Run architecture regression probe
        shell: pwsh
        run: |
          dotnet restore .\Tests\ArchitectureProbe\JuChuang.ArchitectureProbe.csproj
          dotnet build .\Tests\ArchitectureProbe\JuChuang.ArchitectureProbe.csproj -c Release --no-restore
          dotnet run --project .\Tests\ArchitectureProbe\JuChuang.ArchitectureProbe.csproj -c Release --no-build

      - name: Run badge and notification regression probes
        shell: pwsh
        run: |
          dotnet run --project .\Tests\BadgeProbe\JuChuang.BadgeProbe.csproj -c Release
          dotnet run --project .\Tests\RegressionProbe\JuChuang.RegressionProbe.csproj -c Release
          .\Tests\ValidateSettingsTypography.ps1
      - name: Restore win-x64 publish assets
        run: dotnet restore .\JuChuang.csproj -r win-x64

      - name: Publish framework-dependent preview
        shell: pwsh
        run: |
          dotnet publish .\JuChuang.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            --no-restore `
            -p:Version="${{ env.PREVIEW_VERSION }}" `
            -o .\artifacts\FrameworkDependent

      - name: Publish self-contained preview
        shell: pwsh
        run: |
          dotnet publish .\JuChuang.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            --no-restore `
            -p:Version="${{ env.PREVIEW_VERSION }}" `
            -o .\artifacts\SelfContained

      - name: Add preview test guide
        shell: pwsh
        run: |
          Copy-Item .\docs/PR_TESTING.md .\artifacts\FrameworkDependent\PR_TESTING.md
          Copy-Item .\docs/PR_TESTING.md .\artifacts\SelfContained\PR_TESTING.md

      - name: Verify .NET 10 x64 output modes
        shell: pwsh
        run: |
          $fd = Get-Content -Raw .\artifacts\FrameworkDependent\JNest.runtimeconfig.json | ConvertFrom-Json
          if ($fd.runtimeOptions.tfm -ne 'net10.0' -or
              $fd.runtimeOptions.frameworks.name -notcontains 'Microsoft.WindowsDesktop.App') {
            throw 'Framework-dependent build does not require .NET 10 Windows Desktop.'
          }
          if (-not (Test-Path .\artifacts\SelfContained\JNest.exe) -or
              -not (Test-Path .\artifacts\SelfContained\hostpolicy.dll)) {
            throw 'Self-contained win-x64 output is incomplete.'
          }

      - name: Package ZIP files and hashes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .\packages | Out-Null
          $fd = ".\packages\${{ env.PACKAGE_NAME }}-FrameworkDependent-win-x64.zip"
          $sc = ".\packages\${{ env.PACKAGE_NAME }}-SelfContained-win-x64.zip"
          Compress-Archive -Path .\artifacts\FrameworkDependent\* -DestinationPath $fd -Force
          Compress-Archive -Path .\artifacts\SelfContained\* -DestinationPath $sc -Force

          $lines = @()
          foreach ($file in @($fd, $sc)) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash
            $name = Split-Path $file -Leaf
            $lines += "$hash  $name"
          }
          $lines | Set-Content .\packages\SHA256SUMS.txt -Encoding ascii
          Copy-Item .\docs/PR_TESTING.md .\packages\PR_TESTING.md

      - name: Upload preview package
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: .\packages\*
          retention-days: 7
          if-no-files-found: error
