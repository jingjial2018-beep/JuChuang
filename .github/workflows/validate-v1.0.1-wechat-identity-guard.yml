name: Validate WeChat identity window guard
on:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-v1.0.1-wechat-identity-guard.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout identity guard branch
        uses: actions/checkout@v4
        with:
          ref: fix/v1.0.1-wechat-window-identity-guard
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Windows x64
        run: dotnet build JuChuang.csproj -c Release -p:Platform=x64
      - name: Architecture Probe
        run: dotnet run --project Tests/ArchitectureProbe/JuChuang.ArchitectureProbe.csproj -c Release
      - name: Badge Probe
        run: dotnet run --project Tests/BadgeProbe/JuChuang.BadgeProbe.csproj -c Release
      - name: Publish framework-dependent diagnostic
        run: dotnet publish JuChuang.csproj -c Release -r win-x64 --self-contained false -p:Platform=x64 -o out/diagnostic
      - name: Package diagnostic ZIP
        shell: pwsh
        run: Compress-Archive -Path out/diagnostic/* -DestinationPath JNest-v1.0.1-WeChat-IdentityGuard-test-win-x64.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: JNest-v1.0.1-WeChat-IdentityGuard-test-win-x64
          path: JNest-v1.0.1-WeChat-IdentityGuard-test-win-x64.zip
