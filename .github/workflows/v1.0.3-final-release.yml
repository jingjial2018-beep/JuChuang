name: JNest v1.0.3 final release

on:
  push:
    branches:
      - release/v1.0.3-exit-dialog-final
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build and run regression probes
        shell: pwsh
        run: |
          dotnet build .\JuChuang.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($probe in @('BadgeProbe', 'ArchitectureProbe')) {
            $project = ".\Tests\$probe\JuChuang.$probe.csproj"
            dotnet run --project $project -c Release
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Publish Windows x64 packages
        shell: pwsh
        run: |
          dotnet publish .\JuChuang.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=false -p:PublishReadyToRun=false -o .\out\framework
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish .\JuChuang.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishReadyToRun=true -p:IncludeNativeLibrariesForSelfExtract=true -o .\out\selfcontained
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path .\out\framework\* -DestinationPath .\JNest-v1.0.3-FrameworkDependent-win-x64.zip
          Compress-Archive -Path .\out\selfcontained\* -DestinationPath .\JNest-v1.0.3-SelfContained-win-x64.zip
      - name: Publish final release (immutable tag)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'v1.0.3'
          $repo = '${{ github.repository }}'
          $sha = '${{ github.sha }}'
          $notes = Join-Path $PWD 'RELEASE-NOTES-v1.0.3.md'
          if (-not (Test-Path -LiteralPath $notes -PathType Leaf)) { throw "Missing release notes: $notes" }
          $assets = @(
            '.\\JNest-v1.0.3-FrameworkDependent-win-x64.zip',
            '.\\JNest-v1.0.3-SelfContained-win-x64.zip'
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) { throw "Missing binary: $asset" }
          }
          # User requested to replace the v1.0.3 stable release, keeping the version number.
          # First upload/recreate the release against the new commit, then align the tag.
          gh release view $tag --repo $repo *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          $tagRemote = [string](git ls-remote --tags origin "refs/tags/$tag")
          if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect remote version tag' }
          if ($releaseExists) {
            gh release upload $tag @assets --repo $repo --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Unable to overwrite existing assets (tag/release may be immutable)' }
            gh release edit $tag --repo $repo --title 'JNest v1.0.3' --notes-file "$notes" --latest
            if ($LASTEXITCODE -ne 0) { throw 'Unable to update release notes' }
          } else {
            gh release create $tag @assets --repo $repo --target $sha --title 'JNest v1.0.3' --notes-file "$notes" --latest
            if ($LASTEXITCODE -ne 0) { throw 'Unable to create stable release' }
          }
          if ($tagRemote) {
            gh api -X PATCH "repos/$repo/git/refs/tags/$tag" -f sha=$sha -F force=true --silent
            if ($LASTEXITCODE -ne 0) { throw 'Assets published, but failed to update existing tag to built commit' }
          }
