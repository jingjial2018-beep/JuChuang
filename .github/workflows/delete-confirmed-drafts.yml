.3.22-beta1-SelfContained-win-x64.zip","size":72935538,"digest":"sha256:b38853eb510cd2b7f1e409e85d4a93eecfb0456d89f751c3f41c7b508545646c"}]}];
            const {owner, repo} = context.repo;
            const allowed = new Map(selected.map(r => [r.id, r]));
            if (selected.length !== 56 || new Set(selected.map(r => r.id)).size !== 56 ||
                selected.reduce((n, r) => n + r.assets.length, 0) !== 112) {
              throw new Error('Unexpected deletion allowlist');
            }
            const assetFields = assets => assets.map(a => ({id:a.id,name:a.name,size:a.size,digest:a.digest})).sort((a,b) => a.id-b.id);
            const stableFields = releases => JSON.stringify(releases.map(r => ({
              id:r.id,tag:r.tag_name,name:r.name,body:r.body,draft:r.draft,
              prerelease:r.prerelease,target:r.target_commitish,assets:assetFields(r.assets)
            })).sort((a,b) => a.id-b.id));
            const refFields = refs => JSON.stringify(refs.map(r => [r.ref,r.object.sha]).sort((a,b) => a[0].localeCompare(b[0])));
            const releases = await github.paginate(github.rest.repos.listReleases,{owner,repo,per_page:100});
            const stable = releases.filter(r => !allowed.has(r.id));
            if (stable.length !== 34 || stable.some(r => r.draft || /-(beta|rc|preview)/i.test(r.tag_name))) {
              throw new Error('Formal release scope changed');
            }
            const latestBefore = (await github.rest.repos.getLatestRelease({owner,repo})).data;
            if (latestBefore.tag_name !== 'v1.0.7') throw new Error('Latest stable changed');
            const tagsBefore = (await github.rest.git.listMatchingRefs({owner,repo,ref:'tags/'})).data;
            const branchesBefore = (await github.rest.git.listMatchingRefs({owner,repo,ref:'heads/'})).data;
            const existing = [];
            for (const item of selected) {
              if (!/-(beta|rc|preview)/i.test(item.tag)) throw new Error('Stable tag in deletion allowlist');
              let release;
              try { release = (await github.rest.repos.getRelease({owner,repo,release_id:item.id})).data; }
              catch(error) { if(error.status === 404) continue; throw error; }
              if (!release.draft || release.immutable || release.tag_name !== item.tag ||
                  JSON.stringify(assetFields(release.assets)) !== JSON.stringify(assetFields(item.assets))) {
                throw new Error('Draft or asset changed; refusing deletion: ' + item.tag);
              }
              existing.push(release);
            }
            // Preflight every remaining entry before deleting any release.
            let deleted = 0, deletedAssets = 0;
            for (const release of existing) {
              await github.rest.repos.deleteRelease({owner,repo,release_id:release.id});
              let absent = false;
              try { await github.rest.repos.getRelease({owner,repo,release_id:release.id}); }
              catch(error) { if(error.status === 404) absent = true; else throw error; }
              if (!absent) throw new Error('Release still exists: ' + release.tag_name);
              deleted++;
              deletedAssets += release.assets.length;
              core.info('Deleted confirmed draft: ' + release.tag_name);
            }
            const after = await github.paginate(github.rest.repos.listReleases,{owner,repo,per_page:100});
            if (after.length !== 34 || stableFields(after) !== stableFields(stable)) throw new Error('Formal releases changed');
            const latestAfter = (await github.rest.repos.getLatestRelease({owner,repo})).data;
            const tagsAfter = (await github.rest.git.listMatchingRefs({owner,repo,ref:'tags/'})).data;
            const branchesAfter = (await github.rest.git.listMatchingRefs({owner,repo,ref:'heads/'})).data;
            if (latestAfter.id !== latestBefore.id || refFields(tagsBefore) !== refFields(tagsAfter) ||
                refFields(branchesBefore) !== refFields(branchesAfter)) throw new Error('Latest stable or Git refs changed');
            await core.summary.addHeading('Confirmed draft deletion completed')
              .addRaw('Deleted draft releases: ' + deleted + '\n\n')
              .addRaw('Deleted attached packages: ' + deletedAssets + '\n\n')
              .addRaw('Formal releases retained: ' + after.length + '\n\n')
              .addRaw('Latest stable retained: ' + latestAfter.tag_name + '\n\n')
              .addRaw('All ' + tagsAfter.length + ' tags and ' + branchesAfter.length + ' branches retained.\n')
              .write();
