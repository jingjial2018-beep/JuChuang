name: JNest v1.0.6-beta.1 lock and font prerelease

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v1.0.6-beta1-lock-font.yml'

permissions:
  contents: write

concurrency:
  group: publish-windows-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout verified v1.0.6-beta.1 repair commit
        uses: actions/checkout@v4
        with:
          # Exact source revision that passed Windows compile and probes.
          ref: e0c5897dcf4c98896261aef8a101c2f56b493e34

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Read version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content .\JuChuang.csproj
          $version = $project.Project.PropertyGroup.Version | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($version)) { throw "Version is missing from JuChuang.csproj" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore .\JuChuang.csproj

      - name: Run ArchitectureProbe
        shell: pwsh
        run: |
          dotnet restore .\Tests\ArchitectureProbe\JuChuang.ArchitectureProbe.csproj
          dotnet build .\Tests\ArchitectureProbe\JuChuang.ArchitectureProbe.csproj -c Release --no-restore
          dotnet run --project .\Tests\ArchitectureProbe\JuChuang.ArchitectureProbe.csproj -c Release --no-build

      - name: Run BadgeProbe
        shell: pwsh
        run: |
          dotnet restore .\Tests\BadgeProbe\JuChuang.BadgeProbe.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build .\Tests\BadgeProbe\JuChuang.BadgeProbe.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project .\Tests\BadgeProbe\JuChuang.BadgeProbe.csproj -c Release --no-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore win-x64 publish assets
        run: dotnet restore .\JuChuang.csproj -r win-x64

      - name: Publish framework-dependent
        shell: pwsh
        run: |
          dotnet publish .\JuChuang.csproj -c Release -r win-x64 `
            --self-contained false `
            -p:PublishSingleFile=true `
            -p:PublishReadyToRun=true `
            -o .\artifacts\framework-dependent

      - name: Publish self-contained
        shell: pwsh
        run: |
          dotnet publish .\JuChuang.csproj -c Release -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:PublishReadyToRun=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o .\artifacts\self-contained

      - name: Package ZIP files
        id: package
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $framework = "JNest-v$version-FrameworkDependent-win-x64.zip"
          $selfContained = "JNest-v$version-SelfContained-win-x64.zip"
          Compress-Archive -Path .\artifacts\framework-dependent\* -DestinationPath ".\artifacts\$framework" -Force
          Compress-Archive -Path .\artifacts\self-contained\* -DestinationPath ".\artifacts\$selfContained" -Force
          $frameworkHash = (Get-FileHash ".\artifacts\$framework" -Algorithm SHA256).Hash
          $selfContainedHash = (Get-FileHash ".\artifacts\$selfContained" -Algorithm SHA256).Hash
          "framework=$framework" >> $env:GITHUB_OUTPUT
          "self_contained=$selfContained" >> $env:GITHUB_OUTPUT
          "framework_hash=$frameworkHash" >> $env:GITHUB_OUTPUT
          "self_contained_hash=$selfContainedHash" >> $env:GITHUB_OUTPUT

      - name: Prepare release notes
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $releaseNotesPath = ".\RELEASE_NOTES-v$version.md"
          if (-not (Test-Path $releaseNotesPath)) { $releaseNotesPath = ".\RELEASE_NOTES.md" }
          $notes = Get-Content $releaseNotesPath -Raw
          $notes += "`r`n`r`n## Beta.1 replacement build (2026-10-23)`r`n"
          $notes += "- Fixed blank locked UI by hiding HwndHost airspace and restoring work area before hosted clients.`r`n"
          $notes += "- Fixed WPF Show-during-Closing exception from locked tray exit.`r`n"
          $notes += "- Six-character password minimum, centered fields, matching dialog buttons, non-draggable lock windows.`r`n"
          $notes += "- Outlined lock menu icon; unified Source Han Sans typography.`r`n"
          $notes += "- Source commit e0c5897dcf4c98896261aef8a101c2f56b493e34; Windows compile, ArchitectureProbe, BadgeProbe passed. Manual UI and client restore validation required.`r`n"
          $notes += "`r`n### SHA-256`r`n"
          $notes += "- FrameworkDependent: ${{ steps.package.outputs.framework_hash }}`r`n"
          $notes += "- SelfContained: ${{ steps.package.outputs.self_contained_hash }}`r`n"
          Set-Content -Path .\artifacts\release-notes.md -Value $notes -Encoding utf8

      - name: Overwrite existing v1.0.6-beta.1 assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ steps.version.outputs.tag }}"
          if ($tag -ne "v1.0.6-beta.1") { throw "Unexpected tag: $tag" }
          $head = git rev-parse HEAD
          if ($head.Trim() -ne "e0c5897dcf4c98896261aef8a101c2f56b493e34") {
            throw "Unvalidated source commit: $head"
          }
          $release = gh api "repos/${{ github.repository }}/releases/tags/$tag" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or !$release -or !$release.prerelease -or $release.draft) {
            throw "Existing prerelease is missing, draft or not prerelease."
          }
          $frameworkName = "${{ steps.package.outputs.framework }}"
          $selfContainedName = "${{ steps.package.outputs.self_contained }}"
          foreach ($assetName in @($frameworkName, $selfContainedName)) {
            if (-not ($release.assets | Where-Object { $_.name -eq $assetName })) {
              throw "Expected existing asset missing: $assetName"
            }
          }
          $framework = ".\artifacts\$frameworkName"
          $selfContained = ".\artifacts\$selfContainedName"
          gh release upload $tag $framework $selfContained --clobber --repo "${{ github.repository }}"
          if ($LASTEXITCODE -ne 0) { throw "Asset replacement failed" }
          gh release edit $tag --repo "${{ github.repository }}" --notes-file ".\artifacts\release-notes.md" --prerelease
          if ($LASTEXITCODE -ne 0) { throw "Release notes update failed" }
          $updated = gh api "repos/${{ github.repository }}/releases/tags/$tag" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Failed to verify release after upload" }
          foreach ($assetName in @($frameworkName, $selfContainedName)) {
            $asset = @($updated.assets | Where-Object { $_.name -eq $assetName })
            if ($asset.Count -ne 1 -or $asset[0].size -le 0) {
              throw "Replacement asset not verified: $assetName"
            }
            Write-Host "Verified asset $assetName size=$($asset[0].size) id=$($asset[0].id)"
          }
