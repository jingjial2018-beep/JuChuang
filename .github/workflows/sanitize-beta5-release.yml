name: Sanitize published beta release notes
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sanitize-beta5-release.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout anonymized beta.5 notes
        uses: actions/checkout@v4
        with:
          ref: beta/v1.0-identity-beta5
      - name: Update published beta.5 release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit v1.0.0-beta.5 --repo "${{ github.repository }}" --notes-file RELEASE-NOTES-v1.0.0-beta.5.md
