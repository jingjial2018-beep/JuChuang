name: Publish JNest v1.0.2-beta.1
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v1.0.2-beta.1.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  beta:
    runs-on: windows-latest
    steps:
      - name: Checkout source with lifecycle fixes
        uses: actions/checkout@v4
        with:
          ref: beta/v1.0.2-lifecycle-fixes
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Assert source changes exist
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cs = Get-Content MainWindow.xaml.cs -Raw
          $ui = Get-Content MainWindow.xaml -Raw
          $project = Get-Content JuChuang.csproj -Raw
          if ($project -notmatch '<Version>1\.0\.2-beta\.1</Version>') { throw 'Incorrect release version' }
          if ($cs -notmatch 'wechat-identity-duplicate-claims-invalidated') { throw 'Identity conflict fix missing' }
          if ($cs -notmatch 'BrandHeaderPanel.Margin') { throw 'Collapsed logo fix missing' }
          if ($ui -notmatch 'x:Name="BrandHeaderPanel"') { throw 'Brand panel missing' }
          if (!(Test-Path MainWindow.WeChatLoginPrompts.cs)) { throw 'Popup handling missing' }
      - name: Build Windows x64
        run: dotnet build JuChuang.csproj -c Release -p:Platform=x64
      - name: ArchitectureProbe
        run: dotnet run --project Tests/ArchitectureProbe/JuChuang.ArchitectureProbe.csproj -c Release
      - name: BadgeProbe
        run: dotnet run --project Tests/BadgeProbe/JuChuang.BadgeProbe.csproj -c Release
      - name: Publish framework dependent
        run: dotnet publish JuChuang.csproj -c Release -r win-x64 --self-contained false -p:Platform=x64 -o out/framework
      - name: Publish self contained
        run: dotnet publish JuChuang.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -o out/selfcontained
      - name: Package binaries
        shell: pwsh
        run: |
          Compress-Archive -Path out/framework/* -DestinationPath JNest-v1.0.2-beta.1-FrameworkDependent-win-x64.zip
          Compress-Archive -Path out/selfcontained/* -DestinationPath JNest-v1.0.2-beta.1-SelfContained-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: JNest-v1.0.2-beta.1-windows-x64
          path: JNest-v1.0.2-beta.1-*.zip
      - name: Create prerelease (no tag overwrite)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'v1.0.2-beta.1'
          $existing = [string](git ls-remote --tags origin "refs/tags/$tag")
          if ($LASTEXITCODE -ne 0) { throw 'Cannot check tag' }
          if ($existing) { throw 'Tag already exists; refusing overwrite' }
          gh release create $tag JNest-v1.0.2-beta.1-FrameworkDependent-win-x64.zip JNest-v1.0.2-beta.1-SelfContained-win-x64.zip --repo ${{ github.repository }} --target beta/v1.0.2-lifecycle-fixes --title 'JNest v1.0.2-beta.1' --notes-file RELEASE-NOTES-v1.0.2-beta.1.md --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release failed' }
