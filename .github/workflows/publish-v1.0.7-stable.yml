name: Publish JNest v1.0.7 stable

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v1.0.7-stable.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-windows-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout validated stable candidate
        uses: actions/checkout@v4
        with:
          ref: 02bee252d9eb1b6fca5bb0fffd3f38379f10a9ec

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Confirm source and stable version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne '02bee252d9eb1b6fca5bb0fffd3f38379f10a9ec') { throw "Unexpected source revision: $actual" }
          [xml]$project = Get-Content .\JuChuang.csproj
          $version = $project.Project.PropertyGroup.Version | Select-Object -First 1
          if ($version -ne '1.0.7') { throw "Expected v1.0.7, got: $version" }
          if (-not (Test-Path .\RELEASE_NOTES-v1.0.7.md)) { throw "Missing stable release notes" }

      - name: Validate typography and sidebar input rules
        shell: pwsh
        run: .\Tests\ValidateSettingsTypography.ps1

      - name: Build WPF Release
        shell: pwsh
        run: |
          dotnet restore .\JuChuang.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build .\JuChuang.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: ArchitectureProbe
        shell: pwsh
        run: |
          dotnet run --project .\Tests\ArchitectureProbe\JuChuang.ArchitectureProbe.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: BadgeProbe
        shell: pwsh
        run: |
          dotnet run --project .\Tests\BadgeProbe\JuChuang.BadgeProbe.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore Windows x64 publish assets
        shell: pwsh
        run: |
          dotnet restore .\JuChuang.csproj -r win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish framework-dependent
        shell: pwsh
        run: |
          dotnet publish .\JuChuang.csproj -c Release -r win-x64 `
            --self-contained false `
            -p:PublishSingleFile=true `
            -p:PublishReadyToRun=true `
            -o .\artifacts\framework-dependent
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish self-contained
        shell: pwsh
        run: |
          dotnet publish .\JuChuang.csproj -c Release -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:PublishReadyToRun=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o .\artifacts\self-contained
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package ZIP files and SHA-256
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $framework = 'JNest-v1.0.7-FrameworkDependent-win-x64.zip'
          $selfContained = 'JNest-v1.0.7-SelfContained-win-x64.zip'
          Compress-Archive -Path .\artifacts\framework-dependent\* -DestinationPath ".\artifacts\$framework" -Force
          Compress-Archive -Path .\artifacts\self-contained\* -DestinationPath ".\artifacts\$selfContained" -Force
          foreach ($item in @($framework,$selfContained)) {
            if (-not (Test-Path ".\artifacts\$item")) { throw "Missing archive: $item" }
          }
          "framework_hash=$((Get-FileHash ".\artifacts\$framework" -Algorithm SHA256).Hash)" >> $env:GITHUB_OUTPUT
          "self_hash=$((Get-FileHash ".\artifacts\$selfContained" -Algorithm SHA256).Hash)" >> $env:GITHUB_OUTPUT

      - name: Prepare stable release notes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $notes = Get-Content .\RELEASE_NOTES-v1.0.7.md -Raw
          $notes += "`r`n### SHA-256 checksums`r`n"
          $notes += "- FrameworkDependent: ${{ steps.package.outputs.framework_hash }}`r`n"
          $notes += "- SelfContained: ${{ steps.package.outputs.self_hash }}`r`n"
          Set-Content .\artifacts\stable-release-notes.md -Value $notes -Encoding utf8

      - name: Publish immutable v1.0.7 stable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'v1.0.7'
          $repo = '${{ github.repository }}'
          $source = '02bee252d9eb1b6fca5bb0fffd3f38379f10a9ec'
          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag exists; refusing to overwrite." }
          $existingTag = [string](git ls-remote --tags origin "refs/tags/$tag")
          if ($LASTEXITCODE -ne 0) { throw "Cannot check remote tag" }
          if (-not [string]::IsNullOrWhiteSpace($existingTag)) { throw "Tag $tag exists; refusing to move it." }
          $framework = '.\artifacts\JNest-v1.0.7-FrameworkDependent-win-x64.zip'
          $selfContained = '.\artifacts\JNest-v1.0.7-SelfContained-win-x64.zip'
          gh release create $tag $framework $selfContained `
            --repo $repo `
            --target $source `
            --title 'JNest v1.0.7' `
            --notes-file .\artifacts\stable-release-notes.md `
            --latest
          if ($LASTEXITCODE -ne 0) { throw 'GitHub stable release creation failed' }
          $release = gh api "repos/$repo/releases/tags/$tag" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify published release' }
          if ($release.draft -or $release.prerelease -or $release.tag_name -ne $tag) {
            throw 'Published release has incorrect stable status'
          }
          foreach ($asset in @('JNest-v1.0.7-FrameworkDependent-win-x64.zip','JNest-v1.0.7-SelfContained-win-x64.zip')) {
            $match = @($release.assets | Where-Object { $_.name -eq $asset })
            if ($match.Count -ne 1 -or $match[0].size -le 0) { throw "Invalid asset: $asset" }
            Write-Host "Verified asset: $asset ($($match[0].size) bytes)"
          }
