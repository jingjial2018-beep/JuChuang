name: Build and publish JNest beta
on:
  push:
    branches:
      - dev/v0.3.23-beta2-layered-workspace
  workflow_dispatch:
permissions:
  contents: write
jobs:
  beta:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile application and regression probes
        shell: pwsh
        run: |
          dotnet build .\JuChuang.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build .\Tests\BadgeProbe\JuChuang.BadgeProbe.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build .\Tests\ArchitectureProbe\JuChuang.ArchitectureProbe.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project .\Tests\BadgeProbe\JuChuang.BadgeProbe.csproj -c Release --no-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project .\Tests\ArchitectureProbe\JuChuang.ArchitectureProbe.csproj -c Release --no-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish Windows x64 packages
        shell: pwsh
        run: |
          dotnet publish .\JuChuang.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:PublishReadyToRun=true -o .\out\framework
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish .\JuChuang.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishReadyToRun=true -p:IncludeNativeLibrariesForSelfExtract=true -o .\out\selfcontained
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path .\out\framework\* -DestinationPath .\JNest-v0.3.23-beta2-FrameworkDependent-win-x64.zip
          Compress-Archive -Path .\out\selfcontained\* -DestinationPath .\JNest-v0.3.23-beta2-SelfContained-win-x64.zip
      - name: Create or update prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "v0.3.23-beta2"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag .\JNest-v0.3.23-beta2-FrameworkDependent-win-x64.zip .\JNest-v0.3.23-beta2-SelfContained-win-x64.zip --clobber
          } else {
            gh release create $tag .\JNest-v0.3.23-beta2-FrameworkDependent-win-x64.zip .\JNest-v0.3.23-beta2-SelfContained-win-x64.zip --target "${{ github.sha }}" --title "JNest v0.3.23-beta2" --notes-file RELEASE_NOTES.md --prerelease
          }
