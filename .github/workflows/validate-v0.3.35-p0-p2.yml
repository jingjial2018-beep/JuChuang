name: Validate JNest P0-P2 beta
on:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-v0.3.35-p0-p2.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/v0.3.35-p0-p1-p2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Windows x64
        run: dotnet build JuChuang.csproj -c Release -p:Platform=x64
      - name: Run window and account architecture regression checks
        run: dotnet run --project Tests/ArchitectureProbe/JuChuang.ArchitectureProbe.csproj -c Release
      - name: Run unread badge regression checks
        run: dotnet run --project Tests/BadgeProbe/JuChuang.BadgeProbe.csproj -c Release
      - name: Publish test ZIP
        shell: pwsh
        run: |
          dotnet publish JuChuang.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -o test-package
          Compress-Archive -Path test-package/* -DestinationPath JNest-v0.3.35-beta6-P0-P1-P2-test-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: JNest-v0.3.35-beta6-P0-P1-P2-test
          path: JNest-v0.3.35-beta6-P0-P1-P2-test-win-x64.zip

      - name: Publish GitHub prerelease after validation
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v0.3.35-beta6'
          $package = 'JNest-v0.3.35-beta6-P0-P1-P2-test-win-x64.zip'
          $notes = 'Beta test: centered WeChat login window, history account launch UI, login placeholder naming, and existing window hosting safeguards. Native self-drawn title-bar button suppression is not yet guaranteed and requires desktop compatibility testing. The stable v0.3.34 release remains unchanged.'
          gh release view $tag --repo ${{ github.repository }} *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $package --clobber --repo ${{ github.repository }}
          } else {
            gh release create $tag $package --repo ${{ github.repository }} --target dev/v0.3.35-p0-p1-p2 --title 'JNest v0.3.35-beta6 (test)' --notes $notes --prerelease
          }
