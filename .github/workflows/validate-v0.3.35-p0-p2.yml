name: Validate JNest P0-P2 beta
on:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-v0.3.35-p0-p2.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/v0.3.35-p0-p1-p2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Windows x64
        run: dotnet build JuChuang.csproj -c Release -p:Platform=x64
      - name: Publish test ZIP
        shell: pwsh
        run: |
          dotnet publish JuChuang.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -o test-package
          Compress-Archive -Path test-package/* -DestinationPath JNest-v0.3.35-beta1-P0-P1-P2-test-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: JNest-v0.3.35-beta1-P0-P1-P2-test
          path: JNest-v0.3.35-beta1-P0-P1-P2-test-win-x64.zip
