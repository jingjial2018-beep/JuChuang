name: Publish JNest v1.0.1 stable
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v1.0.1.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stable:
    runs-on: windows-latest
    steps:
      - name: Checkout stable source
        uses: actions/checkout@v4
        with:
          ref: release/v1.0.1-stable
          fetch-depth: 0
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Check version and UI dimensions
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $project = Get-Content JuChuang.csproj -Raw
          $xaml = Get-Content MainWindow.xaml -Raw
          $code = Get-Content MainWindow.xaml.cs -Raw
          if ($project -notmatch '<Version>1\.0\.1</Version>') { throw 'Incorrect version' }
          if ($xaml -notmatch 'Source="Assets/app-logo.png" Width="30" Height="30"') { throw 'Incorrect logo' }
          if ($xaml -notmatch 'x:Name="SidebarColumn" Width="280"') { throw 'Incorrect sidebar' }
          if ($code -notmatch 'difference = 216') { throw 'Incorrect sidebar delta' }
          if ($xaml -notmatch '(?s)<!-- Compact 32-DIP account status header.*?<RowDefinition Height="32"') { throw 'Incorrect account status bar' }
          if ($xaml -notmatch '(?s)<Border Grid.Row="2".*?<TextBlock x:Name="WindowCountText"') { throw 'Missing footer' }
      - name: Build Windows x64
        run: dotnet build JuChuang.csproj -c Release -p:Platform=x64
      - name: Validate generated Windows icon
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $ico = Join-Path (Get-Location) 'Assets/app.ico'
          $stream = [System.IO.File]::OpenRead($ico)
          try {
            $reader=[System.IO.BinaryReader]::new($stream)
            $null=$reader.ReadUInt16()
            $type=$reader.ReadUInt16()
            $count=$reader.ReadUInt16()
            if ($type -ne 1 -or $count -lt 7) { throw "Invalid generated ICO: $type / $count" }
          } finally { $stream.Dispose() }
          powershell.exe -NoProfile -STA -Command 'Add-Type -AssemblyName PresentationCore; $u = [Uri]::new((Resolve-Path "Assets/app.ico").Path); $f = [System.Windows.Media.Imaging.BitmapFrame]::Create($u); Write-Host "WPF icon decoded:" $f.PixelWidth $f.PixelHeight'
          if ($LASTEXITCODE -ne 0) { throw 'WPF icon decoder failed' }
      - name: Architecture regression checks
        run: dotnet run --project Tests/ArchitectureProbe/JuChuang.ArchitectureProbe.csproj -c Release
      - name: Badge regression checks
        run: dotnet run --project Tests/BadgeProbe/JuChuang.BadgeProbe.csproj -c Release
      - name: Publish framework dependent
        run: dotnet publish JuChuang.csproj -c Release -r win-x64 --self-contained false -p:Platform=x64 -o out/framework
      - name: Publish self contained
        run: dotnet publish JuChuang.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -o out/selfcontained
      - name: Package ZIPs
        shell: pwsh
        run: |
          Compress-Archive -Path out/framework/* -DestinationPath JNest-v1.0.1-FrameworkDependent-win-x64.zip
          Compress-Archive -Path out/selfcontained/* -DestinationPath JNest-v1.0.1-SelfContained-win-x64.zip
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JNest-v1.0.1-win-x64
          path: JNest-v1.0.1-*.zip
      - name: Create stable Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $tag='v1.0.1'
          $existing=[string](git ls-remote --tags origin "refs/tags/$tag")
          if ($LASTEXITCODE -ne 0) { throw 'Tag lookup failed' }
          if ($existing) { throw 'Existing release tag, refusing overwrite' }
          gh release create $tag JNest-v1.0.1-FrameworkDependent-win-x64.zip JNest-v1.0.1-SelfContained-win-x64.zip --repo ${{ github.repository }} --target release/v1.0.1-stable --title 'JNest v1.0.1' --notes-file RELEASE-NOTES-v1.0.1.md --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release failed' }
