name: Publish JNest v0.99 stable
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v0.99-stable.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout stable source
        uses: actions/checkout@v4
        with:
          ref: release/v0.99-qr-centering
          fetch-depth: 0
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Windows x64 Release
        run: dotnet build JuChuang.csproj -c Release -p:Platform=x64
      - name: Architecture regression checks
        run: dotnet run --project Tests/ArchitectureProbe/JuChuang.ArchitectureProbe.csproj -c Release
      - name: Unread badge regression checks
        run: dotnet run --project Tests/BadgeProbe/JuChuang.BadgeProbe.csproj -c Release
      - name: Publish framework dependent
        run: dotnet publish JuChuang.csproj -c Release -r win-x64 --self-contained false -p:Platform=x64 -o out/framework
      - name: Publish self contained
        run: dotnet publish JuChuang.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -o out/selfcontained
      - name: Package ZIP files
        shell: pwsh
        run: |
          Compress-Archive -Path out/framework/* -DestinationPath JNest-v0.99-FrameworkDependent-win-x64.zip
          Compress-Archive -Path out/selfcontained/* -DestinationPath JNest-v0.99-SelfContained-win-x64.zip
      - name: Upload CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JNest-v0.99-stable-win-x64
          path: JNest-v0.99-*.zip
      - name: Publish v0.99 stable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          $current = [string](git ls-remote --tags origin 'refs/tags/v0.99')
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect existing release tag' }
          if ($current) {
            $oldSha = ($current -split '\s+')[0]
            $backup = "v0.99-before-republish-${{ github.run_number }}"
            git tag $backup $oldSha
            git push origin "refs/tags/$backup"
            if ($LASTEXITCODE -ne 0) { throw 'Tag backup failed: existing release preserved' }
          }
          git tag -f v0.99 HEAD
          git push --force origin refs/tags/v0.99
          if ($LASTEXITCODE -ne 0) { throw 'Unable to update v0.99 tag' }
          # A missing release is expected for the first publish. Avoid native
          # command stderr being promoted to a terminating PowerShell error.
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json"; 'X-GitHub-Api-Version' = '2022-11-28' }
          $check = Invoke-WebRequest -Uri 'https://api.github.com/repos/${{ github.repository }}/releases/tags/v0.99' -Headers $headers -SkipHttpErrorCheck
          if ($check.StatusCode -ne 200 -and $check.StatusCode -ne 404) {
            throw "Release lookup failed with HTTP $($check.StatusCode)"
          }
          if ($check.StatusCode -eq 200) {
            gh release upload v0.99 JNest-v0.99-FrameworkDependent-win-x64.zip JNest-v0.99-SelfContained-win-x64.zip --clobber --repo ${{ github.repository }}
            if ($LASTEXITCODE -ne 0) { throw 'Replacing ZIP files failed' }
            gh release edit v0.99 --repo ${{ github.repository }} --title 'JNest v0.99' --notes-file RELEASE-NOTES-v0.99.md --latest
            if ($LASTEXITCODE -ne 0) { throw 'Updating release notes failed' }
          } else {
            gh release create v0.99 JNest-v0.99-FrameworkDependent-win-x64.zip JNest-v0.99-SelfContained-win-x64.zip --repo ${{ github.repository }} --title 'JNest v0.99' --notes-file RELEASE-NOTES-v0.99.md --latest
            if ($LASTEXITCODE -ne 0) { throw 'Creating release failed' }
          }
