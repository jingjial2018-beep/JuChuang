name: Validate v1.0.1 identity and bounds hotfix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-v1.0.1-window-account-hotfix.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hotfix:
    runs-on: windows-latest
    steps:
      - name: Checkout hotfix source
        uses: actions/checkout@v4
        with:
          ref: fix/v1.0.1-window-account-hotfix
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Windows x64
        run: dotnet build JuChuang.csproj -c Release -p:Platform=x64
      - name: Architecture regression checks
        run: dotnet run --project Tests/ArchitectureProbe/JuChuang.ArchitectureProbe.csproj -c Release
      - name: Badge regression checks
        run: dotnet run --project Tests/BadgeProbe/JuChuang.BadgeProbe.csproj -c Release
      - name: Publish framework dependent
        run: dotnet publish JuChuang.csproj -c Release -r win-x64 --self-contained false -p:Platform=x64 -o out/framework
      - name: Publish self contained
        run: dotnet publish JuChuang.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -o out/selfcontained
      - name: Make packages
        shell: pwsh
        run: |
          Compress-Archive -Path out/framework/* -DestinationPath JNest-v1.0.1-hotfix-test-FrameworkDependent-win-x64.zip
          Compress-Archive -Path out/selfcontained/* -DestinationPath JNest-v1.0.1-hotfix-test-SelfContained-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: JNest-v1.0.1-window-account-hotfix-test
          path: JNest-v1.0.1-hotfix-test-*.zip
