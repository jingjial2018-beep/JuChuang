name: Publish JNest v0.3.36 stable
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v0.3.36-stable.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout stable source
        uses: actions/checkout@v4
        with:
          ref: release/v0.3.36-fixed-window-from-v0.3.35
          fetch-depth: 0
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Windows x64 Release
        run: dotnet build JuChuang.csproj -c Release -p:Platform=x64
      - name: Architecture regression checks
        run: dotnet run --project Tests/ArchitectureProbe/JuChuang.ArchitectureProbe.csproj -c Release
      - name: Unread badge regression checks
        run: dotnet run --project Tests/BadgeProbe/JuChuang.BadgeProbe.csproj -c Release
      - name: Publish framework dependent
        run: dotnet publish JuChuang.csproj -c Release -r win-x64 --self-contained false -p:Platform=x64 -o out/framework
      - name: Publish self contained
        run: dotnet publish JuChuang.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -o out/selfcontained
      - name: Package ZIP files
        shell: pwsh
        run: |
          Compress-Archive -Path out/framework/* -DestinationPath JNest-v0.3.36-FrameworkDependent-win-x64.zip
          Compress-Archive -Path out/selfcontained/* -DestinationPath JNest-v0.3.36-SelfContained-win-x64.zip
      - name: Upload CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JNest-v0.3.36-stable-win-x64
          path: JNest-v0.3.36-*.zip
      - name: Backup old v0.3.36 tag and replace release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          $current = (git ls-remote --tags origin 'refs/tags/v0.3.36').Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect existing release tag' }
          if ($current) {
            $oldSha = ($current -split '\s+')[0]
            $backup = "v0.3.36-before-fixed-window-${{ github.run_number }}"
            git tag $backup $oldSha
            git push origin "refs/tags/$backup"
            if ($LASTEXITCODE -ne 0) { throw 'Tag backup failed: existing release preserved' }
          }
          git tag -f v0.3.36 HEAD
          git push --force origin refs/tags/v0.3.36
          if ($LASTEXITCODE -ne 0) { throw 'Unable to update v0.3.36 tag' }
          gh release view v0.3.36 --repo ${{ github.repository }} *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v0.3.36 JNest-v0.3.36-FrameworkDependent-win-x64.zip JNest-v0.3.36-SelfContained-win-x64.zip --clobber --repo ${{ github.repository }}
            if ($LASTEXITCODE -ne 0) { throw 'Replacing ZIP files failed' }
            gh release edit v0.3.36 --repo ${{ github.repository }} --title 'JNest v0.3.36' --notes-file RELEASE-NOTES-v0.3.36.md --latest
            if ($LASTEXITCODE -ne 0) { throw 'Updating release notes failed' }
          } else {
            gh release create v0.3.36 JNest-v0.3.36-FrameworkDependent-win-x64.zip JNest-v0.3.36-SelfContained-win-x64.zip --repo ${{ github.repository }} --title 'JNest v0.3.36' --notes-file RELEASE-NOTES-v0.3.36.md --latest
            if ($LASTEXITCODE -ne 0) { throw 'Creating release failed' }
          }
