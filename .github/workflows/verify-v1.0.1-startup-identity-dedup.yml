name: Verify v1.0.1 code-level fixes (account lookup and popup ownership)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-v1.0.1-startup-identity-dedup.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout startup identity fix
        uses: actions/checkout@v4
        with:
          ref: fix/v1.0.1-startup-identity-dedup
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Windows x64
        run: dotnet build JuChuang.csproj -c Release -p:Platform=x64
      - name: ArchitectureProbe
        run: dotnet run --project Tests/ArchitectureProbe/JuChuang.ArchitectureProbe.csproj -c Release
      - name: BadgeProbe
        run: dotnet run --project Tests/BadgeProbe/JuChuang.BadgeProbe.csproj -c Release
      - name: Publish Framework-Dependent test build
        run: dotnet publish JuChuang.csproj -c Release -r win-x64 --self-contained false -p:Platform=x64 -o out/test
      - name: Zip test build
        shell: pwsh
        run: Compress-Archive -Path out/test/* -DestinationPath JNest-v1.0.1-startup-identity-test-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: JNest-v1.0.1-startup-identity-test-win-x64
          path: JNest-v1.0.1-startup-identity-test-win-x64.zip
