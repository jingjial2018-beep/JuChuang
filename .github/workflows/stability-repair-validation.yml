name: v1.0.4 Beta stability validation
on:
  push:
    branches:
      - fix/v1.0.3-exit-stability-ui
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build Release
        run: dotnet build .\JuChuang.csproj -c Release
      - name: Badge regression
        run: dotnet run --project .\Tests\BadgeProbe\JuChuang.BadgeProbe.csproj -c Release
      - name: Architecture regression
        run: dotnet run --project .\Tests\ArchitectureProbe\JuChuang.ArchitectureProbe.csproj -c Release
      - name: Package Beta candidates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish .\JuChuang.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=false -p:PublishReadyToRun=false -o .\out\framework
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish .\JuChuang.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishReadyToRun=true -p:IncludeNativeLibrariesForSelfExtract=true -o .\out\selfcontained
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path .\out\framework\* -DestinationPath .\JNest-v1.0.4-beta.1-FrameworkDependent-win-x64.zip
          Compress-Archive -Path .\out\selfcontained\* -DestinationPath .\JNest-v1.0.4-beta.1-SelfContained-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: JNest-v1.0.4-beta.1-${{ github.sha }}
          path: JNest-v1.0.4-beta.1-*.zip
          if-no-files-found: error
          retention-days: 7
