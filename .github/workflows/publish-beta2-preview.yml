name: Publish v2.0.3-beta.2 prerelease (tested candidate only)

on:
  push:
    branches:
      - fix/v2.0.3-beta.2-unread-badge
    paths:
      - .github/workflows/publish-beta2-preview.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: jnest-v2.0.3-beta.2-prerelease
  cancel-in-progress: false

jobs:
  publish-tested-preview:
    if: github.repository == 'jingjial2018-beep/JuChuang'
    runs-on: ubuntu-latest
    steps:
      - name: Confirm exact tested source and successful Windows checks
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA=a2ad299c554303b42403b4d294f1d439ec6a77bc
          BUILD_RUN=41275374381
          PACKAGE_RUN=41275374382
          TAG=v2.0.3-beta.2
          for RUN in "$BUILD_RUN" "$PACKAGE_RUN"; do
            ACTUAL_SHA="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" --jq '.head_sha')"
            RESULT="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" --jq '.conclusion')"
            [[ "$ACTUAL_SHA" == "$SOURCE_SHA" && "$RESULT" == success ]] || {
              echo "::error::Windows CI run $RUN does not match the tested source or has not passed"; exit 1;
            }
          done
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Release already exists; refusing to overwrite"; exit 1;
          fi

      - name: Download successful Windows x64 package artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download 41275374382 \
            --repo "$GITHUB_REPOSITORY" \
            --name JNest-v2.0.3-beta.2-preview-build186 \
            --dir packages
          ls -lah packages

      - name: Validate checksums and prepare versioned release assets
        shell: bash
        run: |
          set -euo pipefail
          cd packages
          test -s SHA256SUMS.txt
          sed 's/\r$//' SHA256SUMS.txt | sha256sum --check -
          shopt -s nullglob
          FW=( *-FrameworkDependent-win-x64.zip )
          SC=( *-SelfContained-win-x64.zip )
          [[ ${#FW[@]} -eq 1 && ${#SC[@]} -eq 1 ]] || exit 1
          unzip -Z1 "${SC[0]}" | grep -qx 'JNest.exe'
          mv "${FW[0]}" JNest-v2.0.3-beta.2-FrameworkDependent-win-x64.zip
          mv "${SC[0]}" JNest-v2.0.3-beta.2-SelfContained-win-x64.zip
          sha256sum JNest-v2.0.3-beta.2-*-win-x64.zip > SHA256SUMS.txt

      - name: Publish GitHub prerelease page (no stable merge)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > notes.md <<'EOF'
          ## JNest v2.0.3-beta.2 — 微信未读角标专项测试版

          **Pre-release；不属于正式稳定版。**

          基于 v2.0.3-beta.1 的微信多开启动优化，重点修复微信总未读保持 16 时，JNest 在 15/16 之间反复跳动的问题。

          - 优先识别左侧聊天导航入口的未读角标，减少误识别会话列表角标的可能。
          - 增加 15/16 双角标、100%/200% DPI 的自动回归测试。
          - 可设置环境变量 JNEST_BADGE_DIAGNOSTIC=1，记录角标坐标及数字识别结果。
          - 不修改 Toast、微信昵称头像、窗口托管、锁屏和启动性能机制。
          - Windows PR Build Check、BadgeProbe、ArchitectureProbe、RegressionProbe、测试包构建均已通过。
          - 尚未完成 Windows 真机验收，建议解压至独立目录测试，不覆盖正式版。

          下载 SelfContained 版无需单独安装 .NET；FrameworkDependent 版需要 .NET 10 Desktop Runtime x64。
          下载后可使用 SHA256SUMS.txt 核验文件完整性。

          代码：PR #71（Draft，尚未合并）；修复代码提交 a2ad299c554303b42403b4d294f1d439ec6a77bc。
          EOF
          gh release create v2.0.3-beta.2 \
            packages/JNest-v2.0.3-beta.2-FrameworkDependent-win-x64.zip \
            packages/JNest-v2.0.3-beta.2-SelfContained-win-x64.zip \
            packages/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target a2ad299c554303b42403b4d294f1d439ec6a77bc \
            --title "JNest v2.0.3-beta.2 — 未读角标专项测试版" \
            --notes-file notes.md \
            --prerelease

      - name: Confirm prerelease state, source commit and assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view v2.0.3-beta.2 --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease,assets \
            --jq 'if (.isDraft == false and .isPrerelease == true and (.assets | length) == 3) then "PASS" else error("Unexpected release state") end'
          TAG_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v2.0.3-beta.2" --jq '.object.sha')"
          [[ "$TAG_SHA" == a2ad299c554303b42403b4d294f1d439ec6a77bc ]] || exit 1
