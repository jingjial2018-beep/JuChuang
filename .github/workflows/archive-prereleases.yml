name: Archive superseded prereleases

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Hide old beta/RC releases or restore their publication
        type: choice
        required: true
        default: hide
        options:
          - hide
          - restore

permissions:
  contents: write

concurrency:
  group: archive-superseded-prereleases
  cancel-in-progress: false

jobs:
  archive:
    if: github.repository == 'jingjial2018-beep/JuChuang'
    runs-on: ubuntu-latest
    steps:
      - name: Archive or restore the reviewed release allowlist
        uses: actions/github-script@v7
        env:
          OPERATION: ${{ inputs.operation }}
        with:
          script: |
            const selected = [{"id":421766386,"tag":"v1.0.6-beta.7"},{"id":421759286,"tag":"v1.0.6-beta.6"},{"id":421748264,"tag":"v1.0.6-beta.5"},{"id":421710841,"tag":"v1.0.6-beta.4"},{"id":421665729,"tag":"v1.0.6-beta.3"},{"id":421606883,"tag":"v1.0.6-beta.2"},{"id":421526822,"tag":"v1.0.6-beta.1"},{"id":419325256,"tag":"v1.0.5-beta.7"},{"id":419269101,"tag":"v1.0.5-beta.6"},{"id":419255010,"tag":"v1.0.5-beta.5"},{"id":419236612,"tag":"v1.0.5-beta.4"},{"id":419223585,"tag":"v1.0.5-beta.3"},{"id":419184539,"tag":"v1.0.5-beta.2"},{"id":419169703,"tag":"v1.0.5-beta.1"},{"id":419107458,"tag":"v1.0.4-beta.7"},{"id":419082182,"tag":"v1.0.4-beta.6"},{"id":417168111,"tag":"v1.0.4-beta.4"},{"id":417140637,"tag":"v1.0.4-beta.3"},{"id":417128429,"tag":"v1.0.4-beta.2"},{"id":417012220,"tag":"v1.0.4-beta.1"},{"id":416377053,"tag":"v1.0.3-rc.9"},{"id":416307693,"tag":"v1.0.3-rc.7"},{"id":416297124,"tag":"v1.0.3-rc.6"},{"id":416284423,"tag":"v1.0.3-rc.5"},{"id":416264776,"tag":"v1.0.3-rc.4"},{"id":416228557,"tag":"v1.0.3-rc.3"},{"id":416211422,"tag":"v1.0.3-rc.2"},{"id":416394123,"tag":"v1.0.3-rc.11"},{"id":416384849,"tag":"v1.0.3-rc.10"},{"id":416196491,"tag":"v1.0.3-rc.1"},{"id":415629139,"tag":"v1.0.2-beta.1"},{"id":415789144,"tag":"v1.0.1-rc.5.6.2"},{"id":415784010,"tag":"v1.0.1-rc.5.6.1"},{"id":415752930,"tag":"v1.0.1-rc.5.6"},{"id":415746500,"tag":"v1.0.1-rc.5.5.1"},{"id":415741884,"tag":"v1.0.1-rc.5.5"},{"id":415712143,"tag":"v1.0.1-rc.5.4"},{"id":415697462,"tag":"v1.0.1-rc.5.3"},{"id":415690283,"tag":"v1.0.1-rc.5.2"},{"id":415683480,"tag":"v1.0.1-rc.5.1"},{"id":415681002,"tag":"v1.0.1-rc.5"},{"id":415665820,"tag":"v1.0.1-rc.4"},{"id":415661709,"tag":"v1.0.1-rc.3"},{"id":415655032,"tag":"v1.0.1-rc.2"},{"id":415649243,"tag":"v1.0.1-rc.1"},{"id":415554076,"tag":"v1.0.1-beta.2"},{"id":414751231,"tag":"v1.0.0-beta.5"},{"id":414553294,"tag":"v1.0.0-beta.4"},{"id":414503696,"tag":"v1.0.0-beta.3"},{"id":414474884,"tag":"v1.0.0-beta.2"},{"id":414451717,"tag":"v1.0.0-beta.1"},{"id":419103544,"tag":"v0.3.34-beta7"},{"id":412588751,"tag":"v0.3.23-beta2"},{"id":412445982,"tag":"v0.3.23-beta1"},{"id":412284663,"tag":"v0.3.22-beta2"},{"id":411838116,"tag":"v0.3.22-beta1"}];
            const {owner, repo} = context.repo;
            const operation = process.env.OPERATION;
            if (!['hide', 'restore'].includes(operation)) throw new Error('Invalid operation');
            const draft = operation === 'hide';
            const latestBefore = (await github.rest.repos.getLatestRelease({owner, repo})).data;
            if (latestBefore.tag_name !== 'v1.0.7') throw new Error('Latest stable changed; review the allowlist first');
            const before = [];
            for (const item of selected) {
              if (!/-(beta|rc|preview)/i.test(item.tag)) throw new Error('Stable tag in allowlist');
              const release = (await github.rest.repos.getRelease({owner, repo, release_id: item.id})).data;
              if (release.tag_name !== item.tag || release.immutable) throw new Error('Release changed: ' + item.tag);
              before.push(release);
            }
            // Complete preflight for all entries before changing any release.
            let changed = 0;
            for (const release of before) {
              if (release.draft === draft) continue;
              const after = (await github.rest.repos.updateRelease({
                owner, repo, release_id: release.id, draft, make_latest: 'false'
              })).data;
              if (after.draft !== draft || after.tag_name !== release.tag_name ||
                  after.body !== release.body || after.name !== release.name ||
                  after.prerelease !== release.prerelease ||
                  JSON.stringify(after.assets.map(a => [a.id, a.name, a.size, a.digest])) !==
                  JSON.stringify(release.assets.map(a => [a.id, a.name, a.size, a.digest]))) {
                throw new Error('Unexpected release or asset change: ' + release.tag_name);
              }
              changed++;
              core.info((draft ? 'Hidden: ' : 'Restored: ') + release.tag_name);
            }
            const latestAfter = (await github.rest.repos.getLatestRelease({owner, repo})).data;
            if (latestAfter.id !== latestBefore.id) throw new Error('Latest stable changed unexpectedly');
            await core.summary.addHeading('Reviewed prerelease maintenance')
              .addRaw('Operation: ' + operation + '\n\n')
              .addRaw('Reviewed: ' + selected.length + '; changed: ' + changed + '\n\n')
              .addRaw('Latest stable retained: ' + latestAfter.tag_name + '\n\n')
              .addRaw('No release assets, tags, branches or commits were deleted.\n')
              .write();

