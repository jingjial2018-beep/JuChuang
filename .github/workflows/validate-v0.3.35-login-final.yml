name: Validate v0.3.35 WeChat Login Centering Final
on:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-v0.3.35-login-final.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/from-v0.3.34-stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Windows x64
        run: dotnet build JuChuang.csproj -c Release -p:Platform=x64
      - name: Architecture regression checks
        run: dotnet run --project Tests/ArchitectureProbe/JuChuang.ArchitectureProbe.csproj -c Release
      - name: Badge regression checks
        run: dotnet run --project Tests/BadgeProbe/JuChuang.BadgeProbe.csproj -c Release
      - name: Package validation build
        shell: pwsh
        run: |
          dotnet publish JuChuang.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -o out
          Compress-Archive -Path out/* -DestinationPath JNest-v0.3.35-login-centering-final-test-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: JNest-v0.3.35-login-centering-final-test-win-x64
          path: JNest-v0.3.35-login-centering-final-test-win-x64.zip
