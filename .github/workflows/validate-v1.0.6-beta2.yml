name: JNest v1.0.6-beta.2 Windows validation (no release)

on:
  push:
    branches:
      - feature/v1.0.6-beta.2-modal-focus
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout Beta source
        uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore project
        run: dotnet restore .\JuChuang.csproj
      - name: Compile Windows WPF Release
        run: dotnet build .\JuChuang.csproj -c Release --no-restore
      - name: Run ArchitectureProbe
        run: dotnet run --project .\Tests\ArchitectureProbe\JuChuang.ArchitectureProbe.csproj -c Release
      - name: Run BadgeProbe
        run: dotnet run --project .\Tests\BadgeProbe\JuChuang.BadgeProbe.csproj -c Release
