name: JNest sidebar right-click interaction validation (no release)
on:
  push:
    branches:
      - feature/v1.0.6-sidebar-rightclick-guard
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-validation:
    runs-on: windows-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore WPF project
        run: dotnet restore .\JuChuang.csproj
      - name: Compile WPF Release
        run: dotnet build .\JuChuang.csproj -c Release --no-restore
      - name: Architecture regression
        run: dotnet run --project .\Tests\ArchitectureProbe\JuChuang.ArchitectureProbe.csproj -c Release
      - name: Notification regression
        run: dotnet run --project .\Tests\BadgeProbe\JuChuang.BadgeProbe.csproj -c Release
