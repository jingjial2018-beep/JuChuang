name: One-time prune archived legacy JNest branches

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-legacy-branch-prune.yml

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: jnest-20261024-legacy-prune
  cancel-in-progress: false

jobs:
  prune-verified-archived:
    if: github.repository == 'jingjial2018-beep/JuChuang'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate archive and remove only matching historical refs
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const stableSha='81f7cb388a6812da6fd841d254a5483d5c0ca32d';
            const archiveSha='283432f66d23d73415e8490937be09f5a7db6329';
            const archiveName='archive/legacy-20261024';
            const manifestPath='docs/HISTORICAL_BRANCH_ARCHIVE_20261024.md';
            const repoInfo=(await github.rest.repos.get({owner,repo})).data;
            if(repoInfo.default_branch!=='stable')throw new Error('Default branch changed; abort');
            const stable=(await github.rest.repos.getBranch({owner,repo,branch:'stable'})).data;
            if(stable.commit.sha!==stableSha || !stable.protected)throw new Error('Stable branch changed or protection disabled');
            const release=(await github.rest.repos.getLatestRelease({owner,repo})).data;
            if(release.tag_name!=='v1.0.7'||release.draft||release.prerelease)throw new Error('Unexpected stable release');
            const allReleases=await github.paginate(github.rest.repos.listReleases,{owner,repo,per_page:100});
            if(allReleases.length!==34||allReleases.some(r=>r.draft||r.prerelease))throw new Error('Unexpected release inventory');
            const archive=(await github.rest.repos.getBranch({owner,repo,branch:archiveName})).data;
            if(archive.commit.sha!==archiveSha)throw new Error('Archive changed');
            const obj=(await github.rest.git.getCommit({owner,repo,commit_sha:archiveSha})).data;
            if(obj.parents.length!==41 || obj.parents[0].sha!==stableSha)throw new Error('Incomplete archive parents');
            const cont=(await github.rest.repos.getContent({owner,repo,path:manifestPath,ref:archiveName})).data;
            if(Array.isArray(cont)||cont.type!=='file'||!cont.content)throw new Error('Missing archive manifest');
            const body=Buffer.from(cont.content,'base64').toString('utf8');
            const candidate=[...body.matchAll(/^\| `([^`]+)` \| `([0-9a-f]{40})` \|$/gm)].map(x=>({name:x[1],sha:x[2]}));
            if(candidate.length!==40)throw new Error('Archive manifest does not describe 40 branches');
            const tipSet=new Set(candidate.map(x=>x.sha));
            if(tipSet.size!==40 || obj.parents.length!==tipSet.size+1 || obj.parents.slice(1).some(p=>!tipSet.has(p.sha)))throw new Error('Archive parent refs do not match manifest');
            const prs=await github.paginate(github.rest.pulls.list,{owner,repo,state:'open',per_page:100});
            if(prs.length!==3)throw new Error('Open PR count changed');
            const protectedNames=new Set(['stable','main','chore/repository-cleanup-20261024','release/v1.0.3-rc7-wechat-singleclick','fix/rc8-recover-showna2',archiveName,...prs.map(p=>p.head.ref)]);
            if([...protectedNames].length!==9)throw new Error('Unexpected preserved branch count');
            if(candidate.some(x=>protectedNames.has(x.name)))throw new Error('Protected branch selected for removal');
            const branches=await github.paginate(github.rest.repos.listBranches,{owner,repo,per_page:100});
            if(branches.length!==49)throw new Error('Repository branch inventory changed: '+branches.length);
            const map=new Map(branches.map(b=>[b.name,b]));
            if(map.size!==49)throw new Error('Duplicate branch names');
            for(const x of candidate) {
              const br=map.get(x.name);
              if(!br || br.commit.sha!==x.sha || br.protected)throw new Error('Branch not eligible: '+x.name);
            }
            if([...map.keys()].some(name=>!protectedNames.has(name)&&!candidate.some(x=>x.name===name)))throw new Error('Uncatalogued branch found');
            core.info('VERIFIED: 40 legacy heads reachable through immutable archive commit '+archiveSha);
            core.info('PRESERVED: stable, main, cleanup, RC7, RC8, 3 PR heads, archive');
            let removed=0;
            for(const x of candidate) {
              const br=(await github.rest.repos.getBranch({owner,repo,branch:x.name})).data;
              if(br.commit.sha!==x.sha || br.protected)throw new Error('Branch moved before deletion: '+x.name);
              await github.rest.git.deleteRef({owner,repo,ref:'heads/'+x.name});
              removed++;
              core.info('Removed archived legacy ref '+x.name);
            }
            const left=await github.paginate(github.rest.repos.listBranches,{owner,repo,per_page:100});
            const leftNames=new Set(left.map(x=>x.name));
            if(removed!==40 || left.length!==9 || [...leftNames].some(x=>!protectedNames.has(x)))throw new Error('Unexpected remaining branches');
            const archive2=(await github.rest.repos.getBranch({owner,repo,branch:archiveName})).data;
            const stable2=(await github.rest.repos.getBranch({owner,repo,branch:'stable'})).data;
            if(archive2.commit.sha!==archiveSha || stable2.commit.sha!==stableSha || !stable2.protected)throw new Error('Archive/stable changed during cleanup');
            await core.summary.addHeading('JNest historical branch pruning — complete')
              .addRaw('Removed **40** archived legacy branch refs. Preserved **9** branches.\n\n')
              .addRaw('Archive commit: `'+archiveSha+'`; parent links: 41; manifest rows: 40.\n\n')
              .addRaw('Stable and all 34 official releases unchanged.\n\n')
              .addCodeBlock([...leftNames].sort().join('\n'))
              .write();
            core.info('SUCCESS: 40 removed, 9 retained, stable/archives/release protected');
