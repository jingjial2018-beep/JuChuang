name: Publish JNest v0.3.35 stable
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v0.3.35-stable.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout stable source from v0.3.34 baseline
        uses: actions/checkout@v4
        with:
          ref: dev/from-v0.3.34-stable
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify existing v0.3.35 and proposed repair source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = git ls-remote --tags origin 'refs/tags/v0.3.35'
          if ($LASTEXITCODE -ne 0 -or !$tag) { throw 'Expected existing v0.3.35 tag is missing' }
          gh release view v0.3.35 --repo ${{ github.repository }} --json tagName --jq .tagName
          if ($LASTEXITCODE -ne 0) { throw 'Existing v0.3.35 Release cannot be verified' }
          if ((git rev-parse --short HEAD) -eq '') { throw 'Checkout not found' }
      - name: Compile x64 Release
        run: dotnet build JuChuang.csproj -c Release -p:Platform=x64
      - name: Architecture regression checks
        run: dotnet run --project Tests/ArchitectureProbe/JuChuang.ArchitectureProbe.csproj -c Release
      - name: Unread badge regression checks
        run: dotnet run --project Tests/BadgeProbe/JuChuang.BadgeProbe.csproj -c Release
      - name: Publish framework dependent
        run: dotnet publish JuChuang.csproj -c Release -r win-x64 --self-contained false -p:Platform=x64 -o out/framework
      - name: Publish self contained
        run: dotnet publish JuChuang.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -o out/selfcontained
      - name: Archive packages
        shell: pwsh
        run: |
          Compress-Archive -Path out/framework/* -DestinationPath JNest-v0.3.35-FrameworkDependent-win-x64.zip
          Compress-Archive -Path out/selfcontained/* -DestinationPath JNest-v0.3.35-SelfContained-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: JNest-v0.3.35-stable-win-x64
          path: JNest-v0.3.35-*.zip
      - name: Backup old tag, replace v0.3.35 assets and tag after tests
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = '${{ github.repository }}'
          $old = (gh api "repos/$repo/git/ref/tags/v0.3.35" --jq '.object.sha').Trim()
          if ($LASTEXITCODE -ne 0 -or !$old) { throw 'Unable to read existing release tag' }
          # Preserve the exact currently published build on every replacement.
          $backup = "v0.3.35-before-centering-hotfix-${{ github.run_number }}"
          gh api -X POST "repos/$repo/git/refs" -f "ref=refs/tags/$backup" -f "sha=$old"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot preserve old release tag; refusing overwrite' }
          $commit = (git rev-parse HEAD).Trim()
          gh api -X PATCH "repos/$repo/git/refs/tags/v0.3.35" -f "sha=$commit" -F "force=true"
          if ($LASTEXITCODE -ne 0) { throw 'Unable to update v0.3.35 tag' }
          gh release upload v0.3.35 JNest-v0.3.35-FrameworkDependent-win-x64.zip JNest-v0.3.35-SelfContained-win-x64.zip --clobber --repo $repo
          if ($LASTEXITCODE -ne 0) { throw 'Unable to replace ZIP assets' }
          gh release edit v0.3.35 --repo $repo --title 'JNest v0.3.35' --notes 'Updated v0.3.35 stable build: fix centered WeChat 4.x compact quick-login window (generic 微信 title). Preserve WhatsApp and remove Add WeChat / Add WhatsApp menu tooltip. Previous release commit preserved under a numbered backup tag. Unsigned Windows x64 packages.'
          if ($LASTEXITCODE -ne 0) { throw 'Unable to update release notes' }
