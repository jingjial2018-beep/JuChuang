name: PR Build Check

on:
  push:
    branches:
      - maintenance/**
  pull_request:
    branches:
      - stable

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore main app
        run: dotnet restore .\JuChuang.csproj

      - name: Build main app
        run: dotnet build .\JuChuang.csproj -c Release --no-restore

      - name: Restore BadgeProbe
        run: dotnet restore .\Tests\BadgeProbe\JuChuang.BadgeProbe.csproj

      - name: Build BadgeProbe
        run: dotnet build .\Tests\BadgeProbe\JuChuang.BadgeProbe.csproj -c Release --no-restore

      - name: Run BadgeProbe
        run: dotnet run --project .\Tests\BadgeProbe\JuChuang.BadgeProbe.csproj -c Release --no-build

      - name: Restore ArchitectureProbe
        run: dotnet restore .\Tests\ArchitectureProbe\JuChuang.ArchitectureProbe.csproj

      - name: Build ArchitectureProbe
        run: dotnet build .\Tests\ArchitectureProbe\JuChuang.ArchitectureProbe.csproj -c Release --no-restore

      - name: Run ArchitectureProbe
        run: dotnet run --project .\Tests\ArchitectureProbe\JuChuang.ArchitectureProbe.csproj -c Release --no-build

      - name: Run RegressionProbe
        run: dotnet run --project .\Tests\RegressionProbe\JuChuang.RegressionProbe.csproj -c Release

      - name: Validate settings typography
        shell: pwsh
        run: .\Tests\ValidateSettingsTypography.ps1

