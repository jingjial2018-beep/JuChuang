name: PR Build Check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore main app
        run: dotnet restore .\JuChuang.csproj

      - name: Build main app
        run: dotnet build .\JuChuang.csproj -c Release --no-restore

      - name: Restore BadgeProbe
        run: dotnet restore .\Tests\BadgeProbe\JuChuang.BadgeProbe.csproj

      - name: Build BadgeProbe
        run: dotnet build .\Tests\BadgeProbe\JuChuang.BadgeProbe.csproj -c Release --no-restore