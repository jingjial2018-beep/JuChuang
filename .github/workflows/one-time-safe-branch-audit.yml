name: JNest safe historical branch audit

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-safe-branch-audit.yml

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: jnest-safe-branch-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.repository == 'jingjial2018-beep/JuChuang'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Audit and optionally prune only redundant branches
        uses: actions/github-script@v7
        env:
          PRUNE_MODE: dry-run
        with:
          script: |
            const {owner, repo} = context.repo;
            const mode = process.env.PRUNE_MODE;
            if (!['dry-run','execute'].includes(mode)) throw new Error('Invalid PRUNE_MODE');
            const meta = (await github.rest.repos.get({owner,repo})).data;
            if (meta.default_branch !== 'stable') throw new Error('Default branch changed');
            const latest = (await github.rest.repos.getLatestRelease({owner,repo})).data;
            if (latest.tag_name !== 'v1.0.7' || latest.draft || latest.prerelease) throw new Error('Stable release changed');
            const stable = (await github.rest.repos.getBranch({owner,repo,branch:'stable'})).data;
            if (stable.commit.sha !== '81f7cb388a6812da6fd841d254a5483d5c0ca32d') throw new Error('Stable baseline changed');
            const releases = await github.paginate(github.rest.repos.listReleases, {owner,repo,per_page:100});
            if (releases.length !== 34 || releases.some(r => r.draft || r.prerelease)) throw new Error('Unexpected release inventory');
            const officialTagNames = new Set(releases.map(r=>r.tag_name));
            const tagNames = [];
            for(const name of officialTagNames) {
              const r = await github.rest.git.getRef({owner,repo,ref:'tags/'+name});
              tagNames.push(r.data.object.sha);
            }
            const stableTagShas = new Set(tagNames);
            const openPRs = await github.paginate(github.rest.pulls.list,{owner,repo,state:'open',per_page:100});
            const preserve = new Set([
              'stable','main','chore/repository-cleanup-20261024',
              'release/v1.0.3-rc7-wechat-singleclick',
              'fix/rc8-recover-showna2',
              ...openPRs.filter(x=>x.head.repo?.full_name === owner+'/'+repo).map(x=>x.head.ref)
            ]);
            const branches = await github.paginate(github.rest.repos.listBranches,{owner,repo,per_page:100});
            const safe = [], review = [], preserved = [];
            for(const br of branches) {
              if(preserve.has(br.name) || br.protected){preserved.push(br.name);continue;}
              if(stableTagShas.has(br.commit.sha)){safe.push({name:br.name,sha:br.commit.sha,reason:'formal tag'});continue;}
              const c=(await github.rest.repos.compareCommits({owner,repo,base:'stable',head:br.commit.sha})).data;
              if((c.status === 'behind' || c.status === 'identical') && c.ahead_by === 0) {
                safe.push({name:br.name,sha:br.commit.sha,reason:c.status});
              } else {
                review.push({name:br.name,sha:br.commit.sha,ahead:c.ahead_by,status:c.status});
              }
            }
            core.info(JSON.stringify({mode,total:branches.length,openPRs:openPRs.length,safe:safe.length,needsReview:review.length,preserved:preserved.length}));
            await core.summary.addHeading('JNest safe historical branch audit')
              .addRaw('Mode: '+mode+'\n\n')
              .addRaw('Total: '+branches.length+'; Safe: '+safe.length+'; Diverged (retained): '+review.length+'; Explicitly preserved: '+preserved.length+'\n\n')
              .addHeading('Safe candidates')
              .addCodeBlock(safe.map(x=>x.name+' | '+x.reason).join('\n')||'(none)')
              .addHeading('Retain for manual review')
              .addCodeBlock(review.map(x=>x.name+' | '+x.status+' | ahead '+x.ahead).join('\n')||'(none)')
              .write();
            if(mode === 'execute') {
              // Full audit before any deletion. Recheck every ref immediately before deleting.
              let removed=0;
              for(const item of safe) {
                const current=(await github.rest.repos.getBranch({owner,repo,branch:item.name})).data;
                if(current.commit.sha !== item.sha || current.protected) throw new Error('Branch modified during audit: '+item.name);
                await github.rest.git.deleteRef({owner,repo,ref:'heads/'+item.name});
                removed++;
                core.info('Deleted redundant branch '+item.name);
              }
              const left=await github.paginate(github.rest.repos.listBranches,{owner,repo,per_page:100});
              if(left.some(x=>safe.some(y=>y.name===x.name)))throw new Error('Deleted branches still present');
              core.info('Deleted '+removed+' safe branches; retained '+left.length);
            }
