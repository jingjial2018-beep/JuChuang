name: JNest rc.2 test release

on:
  push:
    branches:
      - v1.0.3-rc.2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build and run regression probes
        shell: pwsh
        run: |
          dotnet build .\JuChuang.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($probe in @('BadgeProbe', 'ArchitectureProbe')) {
            $project = ".\Tests\$probe\JuChuang.$probe.csproj"
            dotnet run --project $project -c Release
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Publish Windows x64 packages
        shell: pwsh
        run: |
          dotnet publish .\JuChuang.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=false -p:PublishReadyToRun=false -o .\out\framework
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish .\JuChuang.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishReadyToRun=true -p:IncludeNativeLibrariesForSelfExtract=true -o .\out\selfcontained
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path .\out\framework\* -DestinationPath .\JNest-v1.0.3-rc.2-FrameworkDependent-win-x64.zip
          Compress-Archive -Path .\out\selfcontained\* -DestinationPath .\JNest-v1.0.3-rc.2-SelfContained-win-x64.zip
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = 'v1.0.3-rc.2'
          $packages = @('.\JNest-v1.0.3-rc.2-FrameworkDependent-win-x64.zip', '.\JNest-v1.0.3-rc.2-SelfContained-win-x64.zip')
          if (gh release view $tag --repo '${{ github.repository }}' 2>$null) {
            gh release delete-asset $tag SHA256SUMS.txt --yes --repo '${{ github.repository }}' 2>$null
            gh release upload $tag @packages --clobber --repo '${{ github.repository }}'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release edit $tag --repo '${{ github.repository }}' --notes-file .\RELEASE-NOTES-v1.0.3-rc.2.md --prerelease
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $oldTagSha = (git ls-remote origin "refs/tags/$tag").Split()[0]
            if ([string]::IsNullOrWhiteSpace($oldTagSha)) { throw 'Existing release tag not found' }
            git tag -f $tag '${{ github.sha }}'
            git push origin "--force-with-lease=refs/tags/${tag}:$oldTagSha" "refs/tags/${tag}:refs/tags/${tag}"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            gh release create $tag @packages `
              --repo '${{ github.repository }}' --target '${{ github.sha }}' `
              --title 'JNest v1.0.3-rc.2' --notes-file .\RELEASE-NOTES-v1.0.3-rc.2.md --prerelease
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
