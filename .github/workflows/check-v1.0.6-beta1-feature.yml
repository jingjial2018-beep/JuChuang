name: JNest v1.0.6-beta.1 feature branch compile checks

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/check-v1.0.6-beta1-feature.yml'

permissions:
  contents: read

concurrency:
  group: check-v1.0.6-beta1-feature
  cancel-in-progress: false

jobs:
  check:
    runs-on: windows-latest
    steps:
      - name: Checkout v1.0.5 beta.5 tray-menu source
        uses: actions/checkout@v4
        with:
          ref: feature/v1.0.6-beta.1-lock-font

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Read version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content .\JuChuang.csproj
          $version = $project.Project.PropertyGroup.Version | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($version)) { throw "Version is missing from JuChuang.csproj" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore .\JuChuang.csproj

      - name: Run ArchitectureProbe
        shell: pwsh
        run: |
          dotnet restore .\Tests\ArchitectureProbe\JuChuang.ArchitectureProbe.csproj
          dotnet build .\Tests\ArchitectureProbe\JuChuang.ArchitectureProbe.csproj -c Release --no-restore
          dotnet run --project .\Tests\ArchitectureProbe\JuChuang.ArchitectureProbe.csproj -c Release --no-build

      - name: Run BadgeProbe
        shell: pwsh
        run: |
          dotnet restore .\Tests\BadgeProbe\JuChuang.BadgeProbe.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build .\Tests\BadgeProbe\JuChuang.BadgeProbe.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project .\Tests\BadgeProbe\JuChuang.BadgeProbe.csproj -c Release --no-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore win-x64 publish assets
        run: dotnet restore .\JuChuang.csproj -r win-x64

      - name: Publish framework-dependent
        shell: pwsh
        run: |
          dotnet publish .\JuChuang.csproj -c Release -r win-x64 `
            --self-contained false `
            -p:PublishSingleFile=true `
            -p:PublishReadyToRun=true `
            -o .\artifacts\framework-dependent

      - name: Publish self-contained
        shell: pwsh
        run: |
          dotnet publish .\JuChuang.csproj -c Release -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:PublishReadyToRun=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o .\artifacts\self-contained

