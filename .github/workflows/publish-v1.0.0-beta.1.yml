name: Build and publish JNest v1.0.0-beta.1
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v1.0.0-beta.1.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  beta:
    runs-on: windows-latest
    steps:
      - name: Checkout beta source
        uses: actions/checkout@v4
        with:
          ref: beta/v1.0-sidebar-toggle
          fetch-depth: 0
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      # Rebuild from final sidebar-state fix (48b9fd2).
      - name: Build Windows x64
        run: dotnet build JuChuang.csproj -c Release -p:Platform=x64
      - name: Architecture regression checks
        run: dotnet run --project Tests/ArchitectureProbe/JuChuang.ArchitectureProbe.csproj -c Release
      - name: Badge regression checks
        run: dotnet run --project Tests/BadgeProbe/JuChuang.BadgeProbe.csproj -c Release
      - name: Publish framework-dependent
        run: dotnet publish JuChuang.csproj -c Release -r win-x64 --self-contained false -p:Platform=x64 -o out/framework
      - name: Publish self-contained
        run: dotnet publish JuChuang.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -o out/selfcontained
      - name: Create ZIP packages
        shell: pwsh
        run: |
          Compress-Archive -Path out/framework/* -DestinationPath JNest-v1.0.0-beta.1-FrameworkDependent-win-x64.zip
          Compress-Archive -Path out/selfcontained/* -DestinationPath JNest-v1.0.0-beta.1-SelfContained-win-x64.zip
      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JNest-v1.0.0-beta.1-win-x64
          path: JNest-v1.0.0-beta.1-*.zip
      - name: Publish beta prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'v1.0.0-beta.1'
          $existing = [string](git ls-remote --tags origin "refs/tags/$tag")
          if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect tag' }
          if ($existing) { throw 'Beta tag already exists. Refusing to overwrite.' }
          gh release create $tag JNest-v1.0.0-beta.1-FrameworkDependent-win-x64.zip JNest-v1.0.0-beta.1-SelfContained-win-x64.zip --repo ${{ github.repository }} --target beta/v1.0-sidebar-toggle --title 'JNest v1.0.0-beta.1' --notes-file RELEASE-NOTES-v1.0.0-beta.1.md --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'GitHub prerelease creation failed' }
